<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Forest model comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:white;font-family:Arial,Helvetica,sans-serif;color:#173d30}.card{max-width:560px;margin:auto;border:1px solid #ccdcd2;border-radius:10px;overflow:hidden}.select{position:absolute;width:1px;height:1px;opacity:0}.tabs{display:flex;gap:5px;background:#edf3ef;padding:6px;margin:0;border-radius:8px 8px 0 0}.tabs label{flex:1;padding:12px 8px;text-align:center;font-size:14px;font-weight:bold;cursor:pointer;border-radius:5px;line-height:1.4}#ref:checked~.tabs label[for=ref]{background:#294e65;color:white}#emb:checked~.tabs label[for=emb]{background:#006b46;color:white}#ref:focus-visible~.tabs label[for=ref],#emb:focus-visible~.tabs label[for=emb]{outline:3px solid #bf850c;outline-offset:2px}.table-wrap{padding:0}table{border-collapse:collapse;width:100%;font-size:15px;table-layout:fixed}th,td{padding:13px 12px;border-bottom:1px solid #e1e9e4;text-align:left}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#587467;padding-top:19px}th:first-child{width:55%}td:last-child{font-weight:bold;font-variant-numeric:tabular-nums}tbody tr:nth-child(odd){background:#f5f8f6}.e{display:none}#emb:checked~.table-wrap .r{display:none}#emb:checked~.table-wrap .e{display:inline}.uncertainty{font-size:12px;font-weight:normal;white-space:nowrap}@media(max-width:380px){body{padding:6px}.tabs{margin:0}.tabs label{font-size:13px}th,td{padding:12px 8px}table{font-size:14px}}
</style></head><body><section class="card" aria-label="Interactive model comparison">
<input class="select" type="radio" name="model" id="ref" aria-label="Reference model" checked><input class="select" type="radio" name="model" id="emb" aria-label="Embedded model">
<div class="tabs"><label for="ref">Reference model</label><label for="emb">Embedded · ESP32-S3</label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Parameter / metric</th><th scope="col"><span class="r">Reference</span><span class="e">Embedded</span></th></tr></thead><tbody>
<tr><td>Decision trees</td><td><span class="r">200</span><span class="e">80</span></td></tr>
<tr><td>Maximum depth</td><td><span class="r">10</span><span class="e">4</span></td></tr>
<tr><td>PR-AUC</td><td><span class="r">0.622 <span class="uncertainty">± 0.001</span></span><span class="e">0.633 <span class="uncertainty">± 0.010</span></span></td></tr>
<tr><td>ROC-AUC</td><td><span class="r">0.853</span><span class="e">0.850</span></td></tr>
<tr><td>Recall</td><td><span class="r">0.622</span><span class="e">0.633</span></td></tr>
<tr><td>F1-score</td><td><span class="r">0.684</span><span class="e">0.688</span></td></tr>
</tbody></table></div>
</section></body></html>
